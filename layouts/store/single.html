{{ define "main" }}
<article class="post">
  <h1 class="post-title">{{ .Title }}</h1>

  <div class="store-grid">
    {{ range .Params.products }}
    <div class="store-product">
      {{ if .image }}
      <img src="{{ .image }}" alt="{{ .name }}">
      {{ else }}
      <div class="store-product-placeholder">[no image]</div>
      {{ end }}
      <div class="store-product-info">
        <h3>{{ .name }}</h3>
        <p>{{ .description }}</p>
        <span class="store-price">${{ div .price 100 }}.{{ mod .price 100 | printf "%02d" }}</span>
      </div>
      <button
        class="store-add-btn"
        onclick="addToCart('{{ .id }}', '{{ .name | htmlEscape }}', {{ .price }})"
      >+ add to cart</button>
    </div>
    {{ end }}
  </div>

  <div class="store-cart hidden" id="cart">
    <h2>cart</h2>
    <div id="cart-items"></div>
    <div class="cart-footer">
      <span class="cart-total">total: <strong id="cart-total">$0.00</strong></span>
      <button id="checkout-btn" onclick="checkout()">checkout &rarr;</button>
    </div>
  </div>

  <p class="cart-empty-msg" id="cart-empty">your cart is empty.</p>
</article>

<style>
.store-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
  margin: 25px 0;
}

.store-product {
  border: 2px solid var(--accent);
  padding: 15px;
  display: flex;
  flex-direction: column;
}

.store-product img {
  border: none;
  padding: 0;
  width: 100%;
  height: 180px;
  object-fit: cover;
  margin: 0 0 12px;
}

.store-product-placeholder {
  height: 180px;
  border: 1px dashed color-mix(in srgb, var(--foreground) 30%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  color: color-mix(in srgb, var(--foreground) 40%, transparent);
  margin-bottom: 12px;
  font-size: calc(var(--font-size) * 0.85);
}

.store-product-info {
  flex: 1;
}

.store-product-info h3 {
  margin: 0 0 6px;
  font-size: var(--font-size);
}

.store-product-info p {
  margin: 0 0 8px;
  font-size: calc(var(--font-size) * 0.85);
  color: color-mix(in srgb, var(--foreground) 65%, transparent);
}

.store-price {
  color: var(--accent);
  font-weight: bold;
}

.store-add-btn {
  margin-top: 14px;
  width: 100%;
}

.store-cart {
  border: 2px solid var(--foreground);
  padding: 20px;
  margin: 30px 0 10px;
}

.store-cart h2 {
  margin: 0 0 15px;
  font-size: var(--font-size);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid color-mix(in srgb, var(--foreground) 15%, transparent);
  gap: 10px;
}

.cart-item-name {
  flex: 1;
  font-size: calc(var(--font-size) * 0.9);
}

.cart-item-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.cart-qty-btn {
  padding: 1px 8px;
  border-width: 2px;
  font-size: calc(var(--font-size) * 0.8);
  line-height: 1.4;
}

.cart-item-price {
  min-width: 60px;
  text-align: right;
  font-size: calc(var(--font-size) * 0.9);
  color: var(--accent);
}

.cart-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
  gap: 15px;
}

.cart-total {
  font-size: calc(var(--font-size) * 0.95);
}

.cart-total strong {
  color: var(--accent);
}

#checkout-btn {
  flex-shrink: 0;
}

.cart-empty-msg {
  color: color-mix(in srgb, var(--foreground) 50%, transparent);
  font-style: italic;
}

.hidden {
  display: none !important;
}

@media (max-width: 500px) {
  .cart-footer {
    flex-direction: column;
    align-items: flex-start;
  }
  #checkout-btn {
    width: 100%;
  }
}
</style>

<script>
(function () {
  let cart = {};

  function addToCart(id, name, price) {
    if (cart[id]) {
      cart[id].quantity++;
    } else {
      cart[id] = { id, name, price, quantity: 1 };
    }
    render();
  }

  function updateQty(id, delta) {
    if (!cart[id]) return;
    cart[id].quantity += delta;
    if (cart[id].quantity <= 0) delete cart[id];
    render();
  }

  function removeItem(id) {
    delete cart[id];
    render();
  }

  function render() {
    const items = Object.values(cart);
    const cartEl = document.getElementById("cart");
    const emptyEl = document.getElementById("cart-empty");
    const itemsEl = document.getElementById("cart-items");
    const totalEl = document.getElementById("cart-total");

    if (items.length === 0) {
      cartEl.classList.add("hidden");
      emptyEl.classList.remove("hidden");
      return;
    }

    cartEl.classList.remove("hidden");
    emptyEl.classList.add("hidden");

    let total = 0;
    itemsEl.innerHTML = items
      .map((item) => {
        total += item.price * item.quantity;
        const lineTotal = ((item.price * item.quantity) / 100).toFixed(2);
        return `
          <div class="cart-item">
            <span class="cart-item-name">${escHtml(item.name)}</span>
            <div class="cart-item-controls">
              <button class="cart-qty-btn" onclick="window._cart.updateQty('${escHtml(item.id)}', -1)">-</button>
              <span>${item.quantity}</span>
              <button class="cart-qty-btn" onclick="window._cart.updateQty('${escHtml(item.id)}', 1)">+</button>
            </div>
            <span class="cart-item-price">$${lineTotal}</span>
            <button class="cart-qty-btn" onclick="window._cart.removeItem('${escHtml(item.id)}')">x</button>
          </div>`;
      })
      .join("");

    totalEl.textContent = "$" + (total / 100).toFixed(2);
  }

  async function checkout() {
    const items = Object.values(cart);
    if (items.length === 0) return;

    const btn = document.getElementById("checkout-btn");
    btn.textContent = "loading...";
    btn.disabled = true;

    try {
      const res = await fetch("/api/checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ cart: items }),
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      window.location.href = data.url;
    } catch (err) {
      btn.textContent = "error — try again";
      btn.disabled = false;
      console.error(err);
    }
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  window._cart = { addToCart, updateQty, removeItem, checkout };
  window.addToCart = addToCart;
  window.checkout = checkout;

  render();
})();
</script>
{{ end }}
